name: Test

on:
  push:
    branches: [main]        # main へのpush(マージ後)のみ。PRは pull_request で検証し二重実行を避ける
  pull_request:
  workflow_dispatch:

concurrency:                # 同一ブランチの古いrunは自動キャンセル
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (game-engine + logic.ts parity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (dashboard buttons, real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 12     # ハング時に6時間待たず失敗させる
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ubuntu-latest は chromium 必要ライブラリを同梱済み。--with-deps の sudo apt を避けて高速・安定化
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:4000
